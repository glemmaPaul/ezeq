[workspace]
resolver = "2"
members = ["crates/ezeq", "xtask"]
default-members = ["crates/ezeq"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Ezeq contributors"]
repository = "https://github.com/pauloostenrijk/ezeq"

[workspace.dependencies]
# `nih_plug_egui` comes from the egui-baseview repository rather than nih-plug itself: that
# version only captures keyboard events when egui actually wants them (e.g. a focused text
# field) and otherwise lets them through to the host, so things like Ableton's computer MIDI
# keyboard keep working while the editor is open. The nih_plug rev must match the one that
# crate pins, otherwise two copies of nih_plug end up in the dependency graph.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "28b149ec4d62757d0b448809148a0c3ca6e09a95", features = ["assert_process_allocs", "standalone"] }
nih_plug_egui = { git = "https://github.com/BillyDM/egui-baseview.git", rev = "11f487fe915d6208961064e619474b98f971594a" }
rtrb = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
